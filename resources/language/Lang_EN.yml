 # TRANSLATIONS OF THE CHAT ACTIONS
 
CHAT:
  changenickname:
    message:
    - ' '
    - <red><strikethrough>-<gray><strikethrough>---------------------------------------------<red><strikethrough>-
    - <red><bold>!</bold> <yellow>Type your temporary nickname in the chat, it must contain only letters and numbers.
    - ' <gray>- Type <red>cancel</red> <gray>or <click:run_command:"/{_clan} {_cancel}"><hover:show_text:"<red>Click to cancel."><red>[CLICK HERE]</red></hover></click> to cancel.'
    - <red><strikethrough>-<gray><strikethrough>---------------------------------------------<red><strikethrough>-
    - ' '
    actionbar: <red><bold>!</bold> <yellow>Type your temporary nickname in the chat!
    title:
      line: <red>! <yellow>Nickname
      subline: <yellow>Type in the chat!
    bossbar: <red><bold>!</bold> <yellow>Type your nickname in the chat! <red>({time})
  commandunknownplayer:
    message:
    - '%tag% <red>Unknown command, <aqua><click:run_command:"/{_clan} {_help}"><hover:show_text:"<green>Click here to view Help."><red>[CLICK HERE]</red></hover></click> <red>or use <light_purple>/{_clan} {_help} <red>to see the list of available commands.'
    actionbar: <light_purple>/{_clan} {_help} <red>to see available commands.
    title:
      line: <red>! <light_purple>/{_clan} {_help}
      subline: <yellow>To see commands!
    bossbar: <light_purple>/{_clan} {_help} <red>to see available commands. <red>({time})
  commandunknownadmin:
    message:
    - '%tag% <red>Unknown command, <aqua><click:run_command:"/uclan help"><hover:show_text:"<green>Click here to view Help."><red>[CLICK HERE]</red></hover></click> <red>or use <light_purple>/uclan help <red>to see the list of available commands.'
    actionbar: <light_purple>/uclan help <red>to see available commands.
    title:
      line: <red>! <light_purple>/uclan help
      subline: <yellow>To see commands!
    bossbar: <light_purple>/uclan help <red>to see available commands. <red>({time})
