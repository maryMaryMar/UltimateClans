 # TRANSLATIONS OF THE CHAT ACTIONS
 
CHAT:
  changenickname:
    message:
    - ' '
    - <red><strikethrough>-<gray><strikethrough>---------------------------------------------<red><strikethrough>-
    - '<red><bold>!</bold> <yellow>Escribe tu apodo temporal en el chat; solo debe contener letras y números.'
    - ' <gray>- Escribe <red>cancel</red> <gray>o <click:run_command:"/{_clan} {_cancel}"><hover:show_text:"<red>Haz clic para cancelar."><red>[CLIC AQUÍ]</red></hover></click> para cancelar.'
    - <red><strikethrough>-<gray><strikethrough>---------------------------------------------<red><strikethrough>-
    - ' '
    actionbar: '<red><bold>!</bold> <yellow>¡Escribe tu apodo temporal en el chat!'
