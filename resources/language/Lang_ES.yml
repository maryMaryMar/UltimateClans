      line: <red>! <yellow>Apodo
      subline: '<yellow>¡Escribe en el chat!'
    bossbar: '<red><bold>!</bold> <yellow>¡Escribe tu apodo en el chat! <red>({time})'
  commandunknownplayer:
    message:
    - '%tag% <red>Comando desconocido, <aqua><click:run_command:"/{_clan} {_help}"><hover:show_text:"<green>Haz clic aquí para ver la ayuda."><red>[CLIC AQUÍ]</red></hover></click> <red>o usa <light_purple>/{_clan} {_help} <red>para ver la lista de comandos disponibles.'
